name: Release

on:
  push:
    branches:
      - main
      - next
      - beta
      - "1.x"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: semantic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    #if: github.repository == 'jhonpol12321/testing-releases'
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Publish release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          COMMIT_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node <<'NODE'
          (async () => {
            const {
              SLACK_WEBHOOK_URL,
              REPOSITORY,
              REF_NAME,
              SERVER_URL,
              COMMIT_SHA,
              JOB_STATUS,
              ACTOR,
              RUN_URL
            } = process.env;

            const success = JOB_STATUS === "success";
            const cancelled = JOB_STATUS === "cancelled";

            const status = success
              ? { emoji: ":rocket:", title: "Release Successfully Published", color: "#2EB67D" }
              : cancelled
                ? { emoji: ":warning:", title: "Release Cancelled", color: "#ECB22E" }
                : { emoji: ":red_circle:", title: "Release Failed", color: "#E01E5A" };

            const repositoryUrl = `${SERVER_URL}/${REPOSITORY}`;
            const commitUrl = `${repositoryUrl}/commit/${COMMIT_SHA}`;

            const payload = {
              text: `${status.emoji} ${status.title}: ${REPOSITORY} (${REF_NAME})`,
              attachments: [
                {
                  color: status.color,
                  blocks: [
                    {
                      type: "header",
                      text: {
                        type: "plain_text",
                        text: `${status.emoji} ${status.title}`,
                        emoji: true
                      }
                    },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: [
                          `*Repository:* <${repositoryUrl}|${REPOSITORY}>`,
                          `*Branch / Ref:* \`${REF_NAME}\``,
                          `*Commit:* <${commitUrl}|\`${COMMIT_SHA.slice(0, 7)}\`>`,
                          `*Triggered by:* ${ACTOR}`
                        ].join("\n")
                      }
                    },
                    {
                      type: "actions",
                      elements: [
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View Workflow Run"
                          },
                          url: RUN_URL,
                          style: success ? "primary" : "danger"
                        },
                        {
                          type: "button",
                          text: {
                            type: "plain_text",
                            text: "View Commit"
                          },
                          url: commitUrl
                        }
                      ]
                    }
                  ]
                }
              ]
            };

            const response = await fetch(SLACK_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
              signal: AbortSignal.timeout(10000)
            });

            if (!response.ok) {
              throw new Error(`Slack notification failed: ${response.status} ${await response.text()}`);
            }
          })().catch(error => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

